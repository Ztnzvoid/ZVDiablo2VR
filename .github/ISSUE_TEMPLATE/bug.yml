name: Bug report
description: Something does not work as it should (not a crash - for a crash use the crash form).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first. Never attach saves, game files, memory dumps or account details.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen
      description: For a picture problem, say whether it is in one eye, both eyes, the desktop window or the menus only.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Character class, weapons in hand and on the body, selected skill, area.
      placeholder: |
        1. Load an offline character...
        2. ...
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset, controllers and OpenXR runtime
      placeholder: "Quest 3 + Touch with Virtual Desktop; Valve Index with SteamVR"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "mod 0.1.0, launcher 0.1.0, D2R VR engine vrcam 0.163.0, game 3.3.93847"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: Lines of horadrim.ini or d2r_vr.ini that differ from the defaults, if you know them.
      render: ini
  - type: textarea
    id: logs
    attributes:
      label: Log, screenshots or a short recording
      description: Relevant lines of `<game folder>\d2rloader\logs\d2r-vr-frame.log`; remove anything private first.
  - type: checkboxes
    id: offline
    attributes:
      label: Offline
      options:
        - label: I saw this in an offline game, or before entering a game.
          required: true
