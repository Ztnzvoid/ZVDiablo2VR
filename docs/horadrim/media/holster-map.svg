<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img"><title>Holster and bag map</title><desc>Character in T-pose seen from behind: a shield on the upper back left, the bow, a two-handed weapon and javelins on the upper back right (arrows taken behind the right shoulder), one-handed weapons on the hips, bag at the lower back left and right, from the hips down to the seat, potion belt at the front of the waist.</desc>
<style>
.bg{fill:#14110f}
.c-gray>*{fill:#3a342e;stroke:#8a7f72}
.c-purple circle{fill:#5b3f8c;stroke:#c8b4f0}
.c-teal circle{fill:#1f6b63;stroke:#9ee3d8}
rect.c-teal-box{fill:#1f6b63;fill-opacity:0.18;stroke:#9ee3d8}
rect.c-amber{fill:#c9952e;stroke:#f1d28a}
text{font-family:Georgia,'Times New Roman',serif;fill:#e9dcc4}
.th{font-size:15px;font-weight:bold;fill:#f3e6cc}
.ts{font-size:12px;fill:#cdbfa6}
g.c-purple text,g.c-teal text{fill:#fff;font-weight:bold}
</style>
<rect class="bg" x="0" y="0" width="680" height="390" rx="12"/>
<g class="c-gray">
<circle cx="200" cy="58" r="22" stroke-width="0.5"/>
<rect x="60" y="92" width="105" height="18" rx="6" stroke-width="0.5"/>
<rect x="235" y="92" width="105" height="18" rx="6" stroke-width="0.5"/>
<rect x="165" y="84" width="70" height="128" rx="10" stroke-width="0.5"/>
<rect x="170" y="212" width="25" height="120" rx="6" stroke-width="0.5"/>
<rect x="205" y="212" width="25" height="120" rx="6" stroke-width="0.5"/>
</g>
<rect class="c-amber" x="165" y="200" width="70" height="10" rx="3" stroke-width="0.5" stroke-dasharray="3 2"/>
<g class="c-purple"><circle cx="183" cy="112" r="13" stroke-width="0.5"/><text class="ts" x="183" y="112" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-purple"><circle cx="217" cy="112" r="13" stroke-width="0.5"/><text class="ts" x="217" y="112" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-purple"><circle cx="155" cy="196" r="12" stroke-width="0.5"/><text class="ts" x="155" y="196" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="c-purple"><circle cx="245" cy="196" r="12" stroke-width="0.5"/><text class="ts" x="245" y="196" text-anchor="middle" dominant-baseline="central">4</text></g>
<rect class="c-teal-box" x="128" y="214" width="144" height="96" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/>
<g class="c-teal"><circle cx="146" cy="236" r="11" stroke-width="0.5"/><text class="ts" x="146" y="236" text-anchor="middle" dominant-baseline="central">5</text></g>
<g class="c-teal"><circle cx="254" cy="236" r="11" stroke-width="0.5"/><text class="ts" x="254" y="236" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="ts" x="200" y="356" text-anchor="middle">Back view: your left is on the left</text>
<g class="c-purple"><circle cx="394" cy="70" r="11" stroke-width="0.5"/><text class="ts" x="394" y="70" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="th" x="414" y="64" dominant-baseline="central">Shield</text>
<text class="ts" x="414" y="82" dominant-baseline="central">Upper back, left (first choice)</text>
<g class="c-purple"><circle cx="394" cy="122" r="11" stroke-width="0.5"/><text class="ts" x="394" y="122" text-anchor="middle" dominant-baseline="central">2</text></g>
<text class="th" x="414" y="116" dominant-baseline="central">Bow, two-handed, javelins</text>
<text class="ts" x="414" y="134" dominant-baseline="central">Upper back, right. Arrows: right shoulder</text>
<g class="c-purple"><circle cx="394" cy="174" r="11" stroke-width="0.5"/><text class="ts" x="394" y="174" text-anchor="middle" dominant-baseline="central">3</text></g>
<text class="th" x="414" y="168" dominant-baseline="central">One-handed weapon</text>
<text class="ts" x="414" y="186" dominant-baseline="central">Left hip</text>
<g class="c-purple"><circle cx="394" cy="226" r="11" stroke-width="0.5"/><text class="ts" x="394" y="226" text-anchor="middle" dominant-baseline="central">4</text></g>
<text class="th" x="414" y="220" dominant-baseline="central">One-handed weapon</text>
<text class="ts" x="414" y="238" dominant-baseline="central">Right hip</text>
<g class="c-teal"><circle cx="394" cy="278" r="11" stroke-width="0.5"/><text class="ts" x="394" y="278" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="th" x="414" y="272" dominant-baseline="central">Bag (inventory)</text>
<text class="ts" x="414" y="290" dominant-baseline="central">Lower back, from the hips down to the seat</text>
<rect class="c-amber" x="384" y="320" width="20" height="10" rx="3" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="th" x="414" y="318" dominant-baseline="central">Potion belt</text>
<text class="ts" x="414" y="336" dominant-baseline="central">Front, at the waist</text>
</svg>