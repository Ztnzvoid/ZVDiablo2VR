<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>The two wheels</title><desc>Two skill wheels. A left stick click opens a wheel on the left hand: the right hand points at it and its picks go to the right hand (right trigger, B). A right stick click opens a wheel on the right hand: the left hand points at it and its picks go to the left hand (left trigger, X, Y). Each wheel has eight cells, the weapon in the middle and a footer with the holster and bag icons, EQUIPMENT and the chat bubble.</desc>
<style>
.bg{fill:#14110f}
.panel{fill:#1b1714;stroke:#2e2925;stroke-width:1}
.cell{fill:#2a2420;stroke:#6b5233;stroke-width:1.5}
.hot{stroke:#f1d28a;stroke-width:3}
.icon{fill:#3a342e;stroke:#8a7f72;stroke-width:1}
.mid{fill:#231d19;stroke:#8c3f3f;stroke-width:2}
.fic{fill:#2a2420;stroke:#6b5233;stroke-width:1.2}
.laser{stroke:#e0574a;stroke-width:2.5}
.ctrl{fill:#3a342e;stroke:#cdbfa6;stroke-width:1.2}
.rule{stroke:#3a342e;stroke-width:1}
text{font-family:Georgia,'Times New Roman',serif;fill:#e9dcc4}
.tt{font-size:18px;font-weight:bold;fill:#f3e6cc}
.th{font-size:15px;font-weight:bold;fill:#f3e6cc}
.ts{font-size:12px;fill:#cdbfa6}
.tm{font-size:11px;font-weight:bold;letter-spacing:1px;fill:#e9dcc4}
.tk{font-size:9.5px;fill:#cdbfa6}
.tag{font-size:9px;font-weight:bold;letter-spacing:0.5px;fill:#f1d28a}
.tl{font-size:11px;fill:#e0574a}
</style>
<rect class="bg" x="0" y="0" width="1000" height="660" rx="12"/>
<text class="tt" x="24" y="36">The two wheels</text>
<g transform="translate(10,56)">
<rect class="panel" x="0" y="0" width="485" height="470" rx="10"/>
<text class="th" x="18" y="30">Left stick click: a wheel on your LEFT hand</text>
<line class="laser" x1="448" y1="300" x2="322.4" y2="234.3"/>
<circle cx="230" cy="196" r="138" fill="#1a1512" stroke="#6b5233" stroke-width="2"/>
<rect class="cell" x="240.3" y="75.6" width="56" height="56" rx="8"/>
<circle class="icon" cx="268.3" cy="96.6" r="11"/>
<text class="tag" x="268.3" y="121.6" text-anchor="middle">TRIGGER</text>
<rect class="cell" x="294.4" y="129.7" width="56" height="56" rx="8"/>
<circle class="icon" cx="322.4" cy="150.7" r="11"/>
<rect class="cell hot" x="294.4" y="206.3" width="56" height="56" rx="8"/>
<circle class="icon" cx="322.4" cy="227.3" r="11"/>
<text class="tag" x="322.4" y="252.3" text-anchor="middle">B</text>
<rect class="cell" x="240.3" y="260.4" width="56" height="56" rx="8"/>
<circle class="icon" cx="268.3" cy="281.4" r="11"/>
<rect class="cell" x="163.7" y="260.4" width="56" height="56" rx="8"/>
<circle class="icon" cx="191.7" cy="281.4" r="11"/>
<rect class="cell" x="109.6" y="206.3" width="56" height="56" rx="8"/>
<circle class="icon" cx="137.6" cy="227.3" r="11"/>
<rect class="cell" x="109.6" y="129.7" width="56" height="56" rx="8"/>
<circle class="icon" cx="137.6" cy="150.7" r="11"/>
<rect class="cell" x="163.7" y="75.6" width="56" height="56" rx="8"/>
<circle class="icon" cx="191.7" cy="96.6" r="11"/>
<circle class="mid" cx="230" cy="196" r="44"/>
<text class="tm" x="230" y="190" text-anchor="middle">WEAPON</text>
<text class="tk" x="230" y="206" text-anchor="middle">normal attack</text>
<circle class="dot" cx="322.4" cy="234.3" r="3" fill="#e0574a"/>
<circle class="ctrl" cx="448" cy="300" r="14"/>
<text class="tl" x="470" y="330" text-anchor="end">Point at it with your RIGHT hand</text>
<rect class="fic" x="96" y="346" width="32" height="32" rx="6"/>
<line x1="104" y1="371" x2="119" y2="354" stroke="#cdbfa6" stroke-width="5" stroke-linecap="round"/>
<line x1="114" y1="352" x2="123" y2="361" stroke="#f1d28a" stroke-width="2"/>
<rect class="fic" x="136" y="346" width="32" height="32" rx="6"/>
<ellipse cx="152" cy="366" rx="9" ry="8" fill="#8a6a3a"/><path d="M 148 358 L 152 352 L 156 358 z" fill="#8a6a3a"/><line x1="147" y1="358" x2="157" y2="358" stroke="#f1d28a" stroke-width="1.5"/>
<rect class="fic" x="180" y="348" width="100" height="28" rx="6"/>
<text class="tm" x="230" y="366" text-anchor="middle">EQUIPMENT</text>
<rect class="fic" x="326" y="346" width="32" height="32" rx="6"/>
<rect x="332" y="354" width="20" height="13" rx="4" fill="#cdbfa6"/><path d="M 337 367 L 334 373 L 343 367 z" fill="#cdbfa6"/>
<text class="th" x="18" y="404" style="font-size:13px">Picks go to your RIGHT hand:</text>
<text class="ts" x="18" y="423" style="font-size:12px">a trigger - the right trigger holds the skill;</text>
<text class="ts" x="18" y="440" style="font-size:12px">B - the B button holds it.</text>
<text class="ts" x="18" y="457" style="font-size:12px">Line under the wheel: TRIGGER: ...  B: ...</text>
</g>
<g transform="translate(505,56)">
<rect class="panel" x="0" y="0" width="485" height="470" rx="10"/>
<text class="th" x="18" y="30">Right stick click: a wheel on your RIGHT hand</text>
<line class="laser" x1="20" y1="300" x2="137.6" y2="157.7"/>
<circle cx="230" cy="196" r="138" fill="#1a1512" stroke="#6b5233" stroke-width="2"/>
<rect class="cell" x="240.3" y="75.6" width="56" height="56" rx="8"/>
<circle class="icon" cx="268.3" cy="96.6" r="11"/>
<text class="tag" x="268.3" y="121.6" text-anchor="middle">TRIGGER</text>
<rect class="cell" x="294.4" y="129.7" width="56" height="56" rx="8"/>
<circle class="icon" cx="322.4" cy="150.7" r="11"/>
<rect class="cell" x="294.4" y="206.3" width="56" height="56" rx="8"/>
<circle class="icon" cx="322.4" cy="227.3" r="11"/>
<rect class="cell" x="240.3" y="260.4" width="56" height="56" rx="8"/>
<circle class="icon" cx="268.3" cy="281.4" r="11"/>
<rect class="cell" x="163.7" y="260.4" width="56" height="56" rx="8"/>
<circle class="icon" cx="191.7" cy="281.4" r="11"/>
<rect class="cell" x="109.6" y="206.3" width="56" height="56" rx="8"/>
<circle class="icon" cx="137.6" cy="227.3" r="11"/>
<text class="tag" x="137.6" y="252.3" text-anchor="middle">X</text>
<rect class="cell hot" x="109.6" y="129.7" width="56" height="56" rx="8"/>
<circle class="icon" cx="137.6" cy="150.7" r="11"/>
<text class="tag" x="137.6" y="175.7" text-anchor="middle">Y</text>
<rect class="cell" x="163.7" y="75.6" width="56" height="56" rx="8"/>
<circle class="icon" cx="191.7" cy="96.6" r="11"/>
<circle class="mid" cx="230" cy="196" r="44"/>
<text class="tm" x="230" y="190" text-anchor="middle">WEAPON</text>
<text class="tk" x="230" y="206" text-anchor="middle">normal attack</text>
<circle class="dot" cx="137.6" cy="157.7" r="3" fill="#e0574a"/>
<circle class="ctrl" cx="20" cy="300" r="14"/>
<text class="tl" x="14" y="330" text-anchor="start">Point at it with your LEFT hand</text>
<rect class="fic" x="96" y="346" width="32" height="32" rx="6"/>
<line x1="104" y1="371" x2="119" y2="354" stroke="#cdbfa6" stroke-width="5" stroke-linecap="round"/>
<line x1="114" y1="352" x2="123" y2="361" stroke="#f1d28a" stroke-width="2"/>
<rect class="fic" x="136" y="346" width="32" height="32" rx="6"/>
<ellipse cx="152" cy="366" rx="9" ry="8" fill="#8a6a3a"/><path d="M 148 358 L 152 352 L 156 358 z" fill="#8a6a3a"/><line x1="147" y1="358" x2="157" y2="358" stroke="#f1d28a" stroke-width="1.5"/>
<rect class="fic" x="180" y="348" width="100" height="28" rx="6"/>
<text class="tm" x="230" y="366" text-anchor="middle">EQUIPMENT</text>
<rect class="fic" x="326" y="346" width="32" height="32" rx="6"/>
<rect x="332" y="354" width="20" height="13" rx="4" fill="#cdbfa6"/><path d="M 337 367 L 334 373 L 343 367 z" fill="#cdbfa6"/>
<text class="th" x="18" y="404" style="font-size:13px">Picks go to your LEFT hand:</text>
<text class="ts" x="18" y="423" style="font-size:12px">a trigger - the left trigger holds the skill;</text>
<text class="ts" x="18" y="440" style="font-size:12px">X or Y - that button holds it.</text>
<text class="ts" x="18" y="457" style="font-size:12px">Line under the wheel: TRIGGER: ...  X: ...  Y: ...</text>
</g>
<text class="ts" x="24" y="560">The skill you pick again, or the middle: that button holds nothing. An aura, a warcry or an armour given to a trigger is cast at once.</text>
<text class="ts" x="24" y="580">A wheel stays open until you pick or click its stick again; the other stick's click switches to the other wheel. Each cell shows the</text>
<text class="ts" x="24" y="600">buttons holding it. Footer: sheathed sword = the Holster page; sack = the 3D bag; EQUIPMENT = draw or stow weapons, belt potions;</text>
<text class="ts" x="24" y="620">speech bubble = the chat line and the headset keyboard. Your picks are kept for each character between games.</text>
</svg>
